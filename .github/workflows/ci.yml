name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules" --entrypoint promtool \
            prom/prometheus:latest check rules /rules/alerts.yml /rules/recording-rules.yml
      - name: dashboard is valid JSON
        run: python -m json.tool deploy/grafana/agent-janitor-dashboard.json > /dev/null

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-janitor:ci .
      - run: docker run --rm agent-janitor:ci --version
