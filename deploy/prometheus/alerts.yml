groups:
  - name: agent-janitor
    rules:
      - alert: BuildAgentDiskLowAfterCleanup
        expr: agent_janitor_free_percent_after{dry_run="false"} < 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.agent }} still has <10% free disk after cleanup"
          description: >-
            The janitor ran but could not free enough space. Usually a single
            oversized workspace or a non-workspace directory (docker images,
            caches) is filling the disk.

      - alert: AgentJanitorNotRunning
        expr: time() - agent_janitor_last_run_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "agent-janitor has not run on {{ $labels.agent }} for 3h"

      - alert: AgentJanitorErrors
        expr: agent_janitor_errors > 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "agent-janitor failing to delete workspaces on {{ $labels.agent }}"
